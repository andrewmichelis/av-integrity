name: Bug report
description: Report something that isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario / script
      description: Which entry script did you run (run_demo.py or run_m1.py), and any config or scenario settings used?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you running?
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, or runtime, as relevant.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
